[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doname"
version = "0.1.0"
description = "Private, evidence-first domain research for AI naming workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "coconut971"}]
dependencies = [
  "dnspython>=2.6,<3",
  "idna>=3.7,<4",
  "tldextract>=5.1,<6",
  "mcp>=2,<3",
]

[dependency-groups]
dev = ["jsonschema>=4.25,<5"]

[project.scripts]
doname = "doname.cli:main"
doname-mcp = "doname.mcp_server:main"

[project.urls]
Repository = "https://github.com/coconut971/doname"

[tool.setuptools.packages.find]
where = ["."]
include = ["doname*"]

[tool.setuptools.package-data]
doname = ["ui/*.html"]

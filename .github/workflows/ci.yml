name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --dev --python ${{ matrix.python }}
      - name: Python tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build plugin bundle
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/build_plugin.py
      - name: Start extracted bundle and discover MCP tools
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/smoke_bundle.py
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          node-version: "22"
      - name: Validate Agent Plugins manifests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --locked python scripts/validate_manifests.py
      - name: MCP Apps lifecycle smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: node scripts/ui_smoke.js
      - name: Build Python wheel and sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv build --quiet
